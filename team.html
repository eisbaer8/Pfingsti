// team.html
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team-Ansicht</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Team-Ansicht</h1>

  <div style="padding: 0 10px;">
    <p id="teamInfo"></p>

    <div>
  <label>Aufgabe auswählen:</label>
  <select id="taskIdSelect">
    <option value="aufgabe1">Aufgabe 1</option>
    <option value="aufgabe2">Aufgabe 2</option>
    <option value="aufgabe3">Aufgabe 3</option>
    <option value="aufgabe4">Aufgabe 4</option>
    <option value="aufgabe5">Aufgabe 5</option>
    <option value="aufgabe6">Aufgabe 6</option>
    <option value="aufgabe7">Aufgabe 7</option>
    <option value="aufgabe8">Aufgabe 8</option>
    <option value="sonstiges">Sonstiges</option>
  </select>
</div>
    <div>
      <label>Antwort (Text):</label>
      <input id="answer" placeholder="Antwort eingeben">
    </div>
    <div>
      <label>Bild hochladen:</label>
      <input type="file" id="file">
    </div>
    <button onclick="uploadTask()">Antwort + Bild senden</button>
  </div>

  <div id="map"></div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

  
  <script src="firebase.js" defer></script>
  <script src="app.js" defer></script>
  <script src="team.js" defer></script>
</body>
</html>
