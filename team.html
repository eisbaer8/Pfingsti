// team.html
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team-Ansicht</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Team-Ansicht</h1>

  <div style="padding: 0 10px;">
    <p id="teamInfo"></p>

    <div>
      <label>Aufgabe-ID (z.B. aufgabe1):</label>
      <input id="taskId" placeholder="aufgabe1">
    </div>
    <div>
      <label>Antwort (Text):</label>
      <input id="answer" placeholder="Antwort eingeben">
    </div>
    <div>
      <label>Bild hochladen:</label>
      <input type="file" id="file">
    </div>
    <button onclick="uploadTask()">Antwort + Bild senden</button>
  </div>

  <div id="map"></div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

  <script src="firebase.js"></script>
  <script src="app.js"></script>
  <script src="team.js"></script>
</body>
</html>
