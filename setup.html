<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Teams Setup</title>
</head>
<body>
  <h1>Teams Setup</h1>
  <button onclick="createTeams()">Teams anlegen</button>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAgziNQwcsktG5Um2AA2y7sG9I48Rrjx6U",
      authDomain: "pfingsti.firebaseapp.com",
      projectId: "pfingsti",
      storageBucket: "pfingsti.firebasestorage.app",
      messagingSenderId: "440967905315",
      appId: "1:440967905315:web:b8aebe8994209c1068f196",
      measurementId: "G-EX200KBNZ1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function createTeams() {
      const teams = [
        "team1","team2","team3","team4",
        "team5","team6","team7","team8"
      ];

      for (const t of teams) {
        await db.collection("teams").doc(t).set({
          name: t.toUpperCase(),
          location: null,
          reached: []
        });
      }

      alert("Alle Teams erfolgreich angelegt");
    }
  </script>
</body>
</html>
